name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validator
        run: npm test

      - name: Lint scenario fixtures
        run: npm run scenarios:lint

      - name: Validate plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
