name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not this project's declared minimum (engines: node >=18), because the
          # manifest-validation step installs @anthropic-ai/claude-code, which requires
          # node >=22 — on 20 npm installs it anyway but warns EBADENGINE. Testing on the
          # minimum buys nothing here: the 163 checks are static string and YAML assertions
          # with no version-sensitive behavior.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validator
        run: npm test

      - name: Lint scenario fixtures
        run: npm run scenarios:lint

      - name: Validate plugin manifest
        run: |
          # Pinned like every other tool version in this repo (see the scaffold's
          # "Pinned tool versions" table for the rationale). Dependabot bumps it.
          npm install -g @anthropic-ai/claude-code@2.1.226
          claude plugin validate . --strict
